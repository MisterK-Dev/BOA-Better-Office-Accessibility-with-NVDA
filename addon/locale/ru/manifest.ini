summary = "BOA: Better Office Accessibility"
description = """Мощный набор улучшений доступности для Microsoft Office, разработанный для значительного улучшения работы программы экранного доступа для пользователей NVDA. 
    
    Основные возможности:
    - Монитор ячеек: Сохранение и непрерывное отслеживание динамических ячеек Excel.
    - Анализатор макета листа: Мгновенное сканирование листов на наличие скрытых вкладок, защищённых состояний и блоков данных.
    - Массовый организатор листов и быстрое перемещение: Мгновенное перемещение или изменение порядка нескольких листов с помощью доступных диалогов.
    - Палитры цветов PowerPoint: Чтение скрытых кодов Hex и RGB внутри стандартных цветовых сеток.
    
    Пожалуйста, обратитесь к документации справки дополнения для получения полного списка функций и сочетаний клавиш."""
changelog = """## Что нового в v1.6.1
* **Глубокая локализация файлов**: Исправлены пропущенные переводы строк в глубине модулей улучшения Excel (таких как Анализатор макета листа и Быстрое перемещение листов) для обеспечения 100% покрытия локализации.
* **Расширенная поддержка перевода**: В систему добавлены 7 новых языков (турецкий, польский, корейский, украинский, чешский, урду и панджаби).
  *(Примечание: Эти переводы были сгенерированы ИИ, поэтому могут присутствовать незначительные ошибки перевода или неточности.)*"""
