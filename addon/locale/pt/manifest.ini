summary = "BOA: Better Office Accessibility"
description = """Uma poderosa suíte de melhorias de acessibilidade para o Microsoft Office, projetada para aprimorar consideravelmente a experiência com leitores de tela para usuários do NVDA. 
    
    Recursos Principais:
    - Monitor de Células: Salve e rastreie continuamente células dinâmicas do Excel.
    - Analisador de Layout de Planilha: Escaneie instantaneamente planilhas em busca de guias ocultas, estados protegidos e blocos de dados.
    - Organizador de Planilhas em Massa e Movimentador Rápido: Mova ou reordene instantaneamente várias planilhas usando caixas de diálogo acessíveis.
    - Seletores de Cor do PowerPoint: Leia códigos Hex e RGB ocultos dentro de grades de cores padrão.
    
    Consulte a documentação de ajuda do add-on para obter uma lista completa de recursos e atalhos."""
changelog = """## O que há de novo na v1.6.1
* **Localização profunda**: Corrigidas traduções de strings ausentes no interior dos módulos de aprimoramento do Excel (como o Analisador de layout de planilha e o Movedor rápido de planilha) para garantir 100% de cobertura de localização.
* **Suporte a tradução expandido**: Foram adicionados 7 novos idiomas ao sistema (turco, polonês, coreano, ucraniano, tcheco, urdu e punjabi).
  *(Nota: Essas traduções foram geradas por IA, portanto, podem estar presentes alguns pequenos erros de tradução ou imprecisões.)*"""
