summary = "BOA: Better Office Accessibility"
description = """NVDAユーザーのスクリーンリーダー体験を大幅に向上させるために設計された、Microsoft Office向けの強力なアクセシビリティ拡張機能スイートです。 
    
    主な機能:
    - セルモニター: 動的なExcelセルを保存し、継続的に追跡します。
    - シートレイアウトアナライザー: ワークシートの非表示タブ、保護状態、データブロックを即座にスキャンします。
    - 一括シート整理 & クイック移動: アクセシブルなダイアログを使用して、複数のシートを即座に移動または並べ替えます。
    - PowerPointカラーピッカー: 標準色グリッド内の隠されたHexおよびRGBコードを読み上げます。
    
    機能とショートカットの完全なリストについては、アドオンのヘルプドキュメントを参照してください。"""
changelog = """## v1.6.1 の新機能
* **詳細なファイルのローカライズ**: 100%のローカライズカバレッジを確保するために、Excel 拡張モジュール (シートレイアウトアナライザーやクイックシート移動など) の奥深くにある不足していた文字列の翻訳を修正しました。
* **翻訳サポートの拡大**: システムに7つの新しい言語 (トルコ語、ポーランド語、韓国語、ウクライナ語、チェコ語、ウルドゥー語、パンジャブ語) を追加しました。
  *(注: これらの翻訳は AI によって生成されたため、軽微な翻訳エラーや不正確な部分が含まれる場合があります。)*"""
