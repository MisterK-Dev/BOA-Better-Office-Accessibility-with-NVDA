summary = "BOA: Better Office Accessibility"
description = """A powerful suite of accessibility enhancements for Microsoft Office, designed to vastly improve the screen reader experience for NVDA users. 
    
    Key Features:
    - Cell Monitor: Save and continuously track dynamic Excel cells.
    - Sheet Layout Analyzer: Instantly scan worksheets for hidden tabs, protected states, and data blocks.
    - Bulk Sheet Organizer & Quick Mover: Instantly move or reorder multiple sheets using accessible dialogs.
    - PowerPoint Color Pickers: Read hidden Hex and RGB codes inside standard color grids.
    
    Please refer to the add-on help documentation for a complete list of features and shortcuts."""
changelog = """## v1.6.1 ਵਿੱਚ ਨਵਾਂ ਕੀ ਹੈ
* **ਡੀਪ ਫਾਈਲ ਲੋਕਲਾਈਜ਼ੇਸ਼ਨ**: 100% ਲੋਕਲਾਈਜ਼ੇਸ਼ਨ ਕਵਰੇਜ ਨੂੰ ਯਕੀਨੀ ਬਣਾਉਣ ਲਈ ਐਕਸਲ ਇਨਹਾਂਸਮੈਂਟ ਮੋਡਿਊਲਾਂ (ਜਿਵੇਂ ਕਿ ਸ਼ੀਟ ਲੇਆਉਟ ਐਨਾਲਾਈਜ਼ਰ ਅਤੇ ਕਵਿੱਕ ਸ਼ੀਟ ਮੂਵਰ) ਦੇ ਅੰਦਰ ਡੂੰਘੇ ਗੁੰਮ ਹੋਏ ਸਟ੍ਰਿੰਗ ਅਨੁਵਾਦਾਂ ਨੂੰ ਠੀਕ ਕੀਤਾ ਗਿਆ।
* **ਵਿਸਤ੍ਰਿਤ ਅਨੁਵਾਦ ਸਮਰਥਨ**: ਸਿਸਟਮ ਵਿੱਚ 7 ਨਵੀਆਂ ਭਾਸ਼ਾਵਾਂ (ਤੁਰਕੀ, ਪੋਲਿਸ਼, ਕੋਰੀਅਨ, ਯੂਕਰੇਨੀ, ਚੈੱਕ, ਉਰਦੂ ਅਤੇ ਪੰਜਾਬੀ) ਸ਼ਾਮਲ ਕੀਤੀਆਂ ਗਈਆਂ ਹਨ।
  *(ਨੋਟ: ਇਹ ਅਨੁਵਾਦ AI ਦੁਆਰਾ ਤਿਆਰ ਕੀਤੇ ਗਏ ਸਨ, ਇਸਲਈ ਕੁਝ ਮਾਮੂਲੀ ਅਨੁਵਾਦ ਗਲਤੀਆਂ ਜਾਂ ਅਸ਼ੁੱਧੀਆਂ ਮੌਜੂਦ ਹੋ ਸਕਦੀਆਂ ਹਨ।)*"""
